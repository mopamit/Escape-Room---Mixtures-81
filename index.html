 const a=[['room1','חידת שלוש הכוסות'],['room2','אשלגן על־מנגנטי'],['room3','מהול מול מרוכז'],['reflection','רפלקציה וסיכום']];

function dnd(itemSel,zoneSel,drop){
 const items=[...work.querySelectorAll(itemSel)],zones=[...work.querySelectorAll(zoneSel)];
 const clear=()=>{items.forEach(x=>x.classList.remove('sel'));zones.forEach(x=>x.classList.remove('ready'));selected=null};
 const attempt=(item,zone)=>{if(!item)return;let ok=drop(item,zone);if(!ok){S.mistakes++;item.classList.add('shake');setTimeout(()=>item.classList.remove('shake'),350)}clear()};
 items.forEach(item=>{item.draggable=true;item.ondragstart=e=>{selected=item;e.dataTransfer.setData('text/plain',item.dataset.id||'')};item.onclick=()=>{let was=item.classList.contains('sel');clear();if(!was){selected=item;item.classList.add('sel');zones.forEach(z=>z.classList.add('ready'))}}});
 zones.forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');attempt(selected,z)};z.onclick=e=>{if(!e.target.closest(itemSel)&&selected)attempt(selected,z)}});
}

 const i=S.ri,q=REFL[i];
 work.innerHTML=`<section class="screen">${header('תחנה 4','רפלקציה וסיכום','עצרו לחשוב על הדרך. אין תשובה נכונה או שגויה.')}<div class="card">${phases(i,4)}<div class="eye">שאלה ${i+1} מתוך 4 · ${q.title}</div><h3>${q.q()}</h3><textarea id="reflAnswer">${esc(S.refl[q.k])}</textarea><div class="small">התשובות יישמרו בסיכום האישי.</div><div id="reflMsg" class="msg"></div><div class="row">${i?`<button class="btn secondary navbtn" id="reflBack"><img src="${UI_IMAGES.back}" alt="">חזרה</button>`:''}<button class="btn primary navbtn" id="reflNext">${i===3?'סיום ושליחת הרפלקציה':`שמירה והשאלה הבאה<img src="${UI_IMAGES.forward}" alt="">`}</button></div></div></section>`;
 $('reflAnswer').oninput=e=>S.refl[q.k]=e.target.value;if(i)$('reflBack').onclick=()=>{S.ri--;render()};$('reflNext').onclick=()=>{let a=$('reflAnswer').value.trim();S.refl[q.k]=a;if(!a)return msg('reflMsg','כתבו תשובה קצרה לפני שממשיכים.');if(i<3){S.ri++;render()}else complete('reflection','end','כל התחנות הושלמו!')};
}
function summary(){
 let chosen=CUPS.find(c=>c.id===S.chosen)?.n||'';return['תעלומת התערובות — סיכום אישי',`שם: ${S.name}`,`יעד זמן: ${S.time} דקות`,`אופן התצפית: ${S.mode==='physical'?'ניסוי עם ציוד':'הדמיה דיגיטלית'}`,'',`הכוס שבחרתי: ${chosen}`,S.description,'','תכנון תערובות:',...Object.entries(S.plan).map(([k,p])=>`${({water:'מים',oil:'שמן',alcohol:'כוהל'})[k]} + ${p.m}: ${p.p==='homo'?'אחידה':'לא אחידה'}`),'','תצפית באשלגן על־מנגנטי:',`במים: ${S.solvents.water.d}`,`בכוהל: ${S.solvents.alcohol.d}`,'',`הסבר מהילה: ${S.dilution}`,'','רפלקציה:',...REFL.flatMap(q=>[`${q.title}: ${q.q()}`,S.refl[q.k],''])].join('\n')
}
function download(){let b=new Blob(['\uFEFF'+summary()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`סיכום-תעלומת-התערובות-${S.name.replace(/[^\p{L}\p{N}-]+/gu,'-')}.txt`;a.click();URL.revokeObjectURL(u)}
function end(){
 work.innerHTML=`<section class="screen"><div class="certificate"><div class="eye">תעודת הצלחה · רשת אמית</div><h2>פיצחתם את תעלומת התערובות!</h2><div class="certname">${esc(S.name)}</div><p>השלמתם תצפיות ומיון, זיהיתם ממס, מומס ותמיסה, והסברתם ריכוז ומהילה.</p><div class="badge">4 מתוך 4 תחנות הושלמו</div></div><div class="row"><button class="btn primary" id="downloadBtn">הורדת הסיכום האישי</button><button class="btn" id="printBtn">הדפסת התעודה</button><button class="btn secondary" id="againBtn">משחק חדש</button></div></section>`;$('downloadBtn').onclick=download;$('printBtn').onclick=()=>window.print();$('againBtn').onclick=reset
}
window.downloadSummary=download;
function hintText(){if(S.screen==='room1')return['חומר טהור כולל סוג אחד של חומר; תערובת כוללת כמה חומרים.','אם המראה אחיד ולא מבחינים במרכיבים — התערובת הומוגנית.','בדקו אם רואים שכבה או גרגרים.','אוויר ומסג נראים אחידים; בסלט ובמשקה עם בועות מבחינים במרכיבים.','השערה אינה חייבת להיות נכונה; היא נבדקת בתצפית.'][S.r1];if(S.screen==='room2')return['התבוננו אם הנוזל נראה אחיד לאחר ההדגמה.','הממס הוא הנוזל בכל כלי; המומס הוא אשלגן על־מנגנטי.','מי נמצא בכמות גדולה, מי מתפזר, ומה שם התוצר האחיד?'][S.r2];if(S.screen==='room3')return S.concSolved?'בעת מהילה מוסיפים ממס, אך כמות המומס אינה משתנה.':'ככל שהצבע חזק יותר, יש יותר מומס ביחס לאותה כמות ממס.';return'תארו רגע מסוים: מה עשיתם, מה חשבתם ומה למדתם.'}
function open(id){document.getElementById(id).classList.add('show')}function close(id){document.getElementById(id).classList.remove('show')}function reset(){S=fresh();selected=null;close('restartM');render()}
function render(){progress();selected=null;if(S.screen==='intro')renderIntro();else if(S.screen==='room1')renderR1();else if(S.screen==='room2')renderR2();else if(S.screen==='room3')renderR3();else if(S.screen==='reflection')reflection();else end();work.scrollTop=0;work.focus({preventScroll:true})}
$('help').onclick=()=>open('helpM');$('settings').onclick=()=>open('restartM');$('home').onclick=()=>open('restartM');$('menu').onclick=()=>{$('mobileSteps').innerHTML=$('steps').innerHTML;open('menuM')};$('hint').onclick=()=>{S.hints++;$('hintText').textContent=hintText();open('hintM')};$('yesRestart').onclick=reset;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)close(m.id)});document.onkeydown=e=>{if(e.key==='Escape')document.querySelectorAll('.modal.show').forEach(m=>close(m.id))};
render();
})();
</script>
</body>
</html>
